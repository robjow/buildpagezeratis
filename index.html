<style>
:root {
  color-scheme: dark;
  --bg: #0D0E14; --fg: #ECEEF4; --muted: #9BA1B6; --line: #262A3B;
  --violet: #8A5CFF; --teal: #1FD6C4;
  --head: "Sora", "Segoe UI", Helvetica, Arial, sans-serif;
  --body: "DM Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --pad: clamp(20px, 4vw, 56px);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 4px; }

#field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(640px 520px at 78% 46%, rgba(138, 92, 255, .20), transparent 70%), radial-gradient(520px 420px at 92% 78%, rgba(31, 214, 196, .12), transparent 70%); }

.page { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; padding: max(20px, env(safe-area-inset-top)) var(--pad) max(20px, env(safe-area-inset-bottom)); }
header { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
.wordmark { height: 20px; width: auto; color: #fff; display: block; }
.soon { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px 6px 12px; background: rgba(13, 14, 20, .6); backdrop-filter: blur(6px); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); position: relative; }
.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--teal); opacity: 0; animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(2); opacity: 0; } }

main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); align-items: center; gap: clamp(20px, 4vw, 64px); padding: clamp(28px, 6vh, 72px) 0; }
.copy { max-width: 700px; }
h1 { margin: 0; font-family: var(--head); font-weight: 700; letter-spacing: -0.035em; line-height: .98; font-size: clamp(50px, 8vw, 116px); }
h1 .l { display: block; overflow: hidden; padding-bottom: .08em; white-space: nowrap; }
h1 .l > span { display: block; transform: translateY(105%); animation: rise 1s cubic-bezier(.2, .8, .2, 1) forwards; }
h1 .l:nth-child(2) > span { animation-delay: .18s; }
h1 .know { background: linear-gradient(100deg, var(--violet), var(--teal) 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
@keyframes rise { to { transform: none; } }

.status { list-style: none; margin: clamp(36px, 7vh, 72px) 0 0; padding: 0; max-width: 440px; display: grid; }
.status li { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); font-size: 17px; opacity: 0; transform: translateY(8px); animation: item .7s var(--d, 1s) ease forwards; }
.status li:last-child { border-bottom: 1px solid var(--line); }
@keyframes item { to { opacity: 1; transform: none; } }
.status small { color: var(--muted); font-size: 15px; }
.status .tick { color: var(--teal); }
.status .tick path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s calc(var(--d, 1s) + .35s) ease forwards; }
.status .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(138, 92, 255, .3); border-top-color: var(--violet); animation: spin 1.1s linear infinite; margin: 0 4px; }
.status .blink { animation: blink 1.6s ease-in-out infinite; color: var(--violet); }
@keyframes blink { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }

.stage { position: relative; display: grid; place-items: center; min-height: 300px; }
.mark { width: min(100%, 560px); aspect-ratio: 1; transform: translate3d(calc(var(--px, 0) * 16px), calc(var(--py, 0) * 12px), 0); transition: transform .5s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
.mark svg { width: 100%; height: 100%; overflow: visible; }
.mark .ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.5s .2s cubic-bezier(.6, 0, .2, 1) forwards; }
.mark .ring.b { animation-delay: .45s; }
.mark .zp { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s 1.1s cubic-bezier(.6, 0, .2, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.mark .halo { opacity: 0; animation: halo 3.6s 2.4s ease-in-out infinite; }
@keyframes halo { 0%, 100% { opacity: 0; } 50% { opacity: .9; } }
.gate { fill: var(--teal); opacity: 0; animation: gate 3.6s 2.6s ease-in-out infinite; }
.gate.g2 { animation-delay: 3.4s; }
@keyframes gate { 0%, 100% { opacity: 0; transform: scale(.4); } 45% { opacity: 1; transform: scale(1); } 80% { opacity: 0; transform: scale(2.4); } }
.gate { transform-box: fill-box; transform-origin: center; }

footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 14px; font-size: 14px; color: var(--muted); }
footer .pec { color: var(--fg); font-weight: 500; }
footer nav { display: flex; gap: 22px; } footer a { text-decoration: none; } footer a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }

@media (max-width: 900px) {
  .page { overflow: hidden; }
  main { grid-template-columns: 1fr; padding-top: 18px; }
  .stage { position: absolute; right: -18vw; top: 14vh; width: 90vw; opacity: .22; pointer-events: none; z-index: -1; min-height: 0; }
  .copy { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  h1 .l > span, .status li, .mark .ring, .mark .zp, .status .tick path { animation: none; transform: none; opacity: 1; stroke-dashoffset: 0; }
  .pulse::after, .mark .halo, .gate, .status .spin, .status .blink { animation: none; }
  .status .spin { border-top-color: var(--violet); }
  .mark { transition: none; }
}
</style>

<script>
/* ---------- Interactive dot field ---------- */
(function () {
  var c = document.getElementById('field'), ctx = c.getContext('2d');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dots = [], w = 0, h = 0, dpr = 1, gap = 30, mx = -999, my = -999, tx = -999, ty = -999, t0 = performance.now(), running = true;
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gap = w < 700 ? 26 : 30; dots = [];
    for (var y = gap / 2; y < h; y += gap) for (var x = gap / 2; x < w; x += gap) dots.push([x, y]);
    if (reduce) draw(0);
  }
  function mix(a, b, k) { return Math.round(a + (b - a) * k); }
  function draw(now) {
    ctx.clearRect(0, 0, w, h);
    mx += (tx - mx) * 0.12; my += (ty - my) * 0.12;
    var scan = ((now - t0) / 9000 % 1.25) * (h + 200) - 100;
    for (var i = 0; i < dots.length; i++) {
      var x = dots[i][0], y = dots[i][1], dx = x - mx, dy = y - my, d = Math.sqrt(dx * dx + dy * dy);
      var near = Math.max(0, 1 - d / 170), sc = Math.max(0, 1 - Math.abs(y - scan) / 70) * 0.55;
      var k = Math.min(1, near + sc), kx = x / w;
      var r = 1 + k * 1.9, a = 0.13 + k * 0.85;
      var R = mix(150, mix(138, 31, kx), Math.min(1, k * 1.4)), G = mix(156, mix(92, 214, kx), Math.min(1, k * 1.4)), B = mix(184, mix(255, 196, kx), Math.min(1, k * 1.4));
      var ox = near * (dx / (d || 1)) * -5, oy = near * (dy / (d || 1)) * -5;
      ctx.fillStyle = 'rgba(' + R + ',' + G + ',' + B + ',' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x + ox, y + oy, r, 0, 6.283); ctx.fill();
    }
  }
  function loop(now) { if (running) draw(now); requestAnimationFrame(loop); }
  addEventListener('resize', size); size();
  if (!reduce) {
    addEventListener('pointermove', function (e) {
      tx = e.clientX; ty = e.clientY;
      var m = document.getElementById('mark');
      m.style.setProperty('--px', ((e.clientX / w) * 2 - 1).toFixed(3)); m.style.setProperty('--py', ((e.clientY / h) * 2 - 1).toFixed(3));
    }, { passive: true });
    addEventListener('pointerleave', function () { tx = ty = -999; });
    document.addEventListener('visibilitychange', function () { running = !document.hidden; });
    requestAnimationFrame(loop);
  }
})();

</script>
